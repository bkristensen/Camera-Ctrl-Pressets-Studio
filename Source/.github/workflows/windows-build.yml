name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test and create unsigned installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Upload unsigned test builds
        uses: actions/upload-artifact@v4
        with:
          name: Cam-Pressets-unsigned-test-builds
          path: |
            artifacts/*-portable.zip
            artifacts/installers/*.exe
          if-no-files-found: error
